<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rauf AnaSayfa</title>
    <style>
        body
        {
            align-items: center;
            text-align: center;
            background-color: black;
        }

        .container
        {
            background-color: darkgrey;
            border-radius: 10px;
            border: 5px solid red;
            width: 600px;
            height: 400px;
            margin: 400px auto;
            transition: 0.5;
        }

        .container:hover
        {
            background-color: black;
            transition: 0.5s;
        }

        button
        {
            margin: 1px auto;
            width: 150px;
            height: 120px;
            background-color: black;
            border: 6px solid red;
            color: whitesmoke;
            border-radius: 360px;
            transition: 0.5s;
            flex-direction: column;
        }

        button:hover
        {
            width: 170px;
            height: 150px;
            transition: 0.5s;
        }

        h1
        {
            text-align: center;
            font-size: 100px;
            color: whitesmoke;
        }
    </style>
</head>
<body>
    <h1></h1>
    <div class="container">
        <h1>Rauf Website</h1>
        <a href="kayit.html"><button>Kayıt İçin Tıkla</button></a>
        <a href="oyun.html"> <button>Oyun için Tıkla</button></a>

    </div>
</body>
</html>
